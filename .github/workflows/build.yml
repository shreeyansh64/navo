# Builds the Android APK and the iOS IPA from the same commit.
# iOS can only be compiled on macOS, so this runs on GitHub's macOS runners —
# trigger it from Windows via the "Actions" tab ("Run workflow") or by pushing a tag like v1.0.0.
#
# Required repo secret:
#   ENV_FILE                  full contents of your local .env (it is gitignored but bundled into the app)
# Optional secrets for a signed, installable IPA (without them an unsigned build is produced):
#   IOS_CERTIFICATE_P12_BASE64  Apple Distribution certificate (.p12), base64-encoded
#   IOS_CERTIFICATE_PASSWORD    password of that .p12
#   IOS_PROVISION_PROFILE_BASE64  provisioning profile (.mobileprovision), base64-encoded
#   IOS_EXPORT_METHOD           app-store | ad-hoc  (defaults to ad-hoc)

name: Build Android + iOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Write .env
        run: printf '%s\n' "${{ secrets.ENV_FILE }}" > .env
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: navo-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Write .env
        run: printf '%s\n' "${{ secrets.ENV_FILE }}" > .env
      - run: flutter pub get

      - name: Install signing certificate and profile
        id: signing
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "No signing secrets set; building unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$PROFILE_PLIST"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST" | cut -d. -f2-)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD:-ad-hoc}</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict>
          </plist>
          EOF

          # Point the Runner target at this team/profile for the release build.
          PBX=ios/Runner.xcodeproj/project.pbxproj
          BUNDLE_ID="$BUNDLE_ID" TEAM_ID="$TEAM_ID" PROFILE_NAME="$PROFILE_NAME" perl -pi -e '
            s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*navo;/PRODUCT_BUNDLE_IDENTIFIER = $ENV{BUNDLE_ID};\n\t\t\t\tDEVELOPMENT_TEAM = $ENV{TEAM_ID};\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{PROFILE_NAME}";\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";/g
          ' "$PBX"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed IPA
        if: steps.signing.outputs.signed == 'true'
        run: flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Build unsigned IPA
        if: steps.signing.outputs.signed != 'true'
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          (cd build/ios/ipa && zip -qr navo-unsigned.ipa Payload && rm -rf Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: navo-ios-ipa
          path: build/ios/ipa/*.ipa
